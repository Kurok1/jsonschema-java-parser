name: Release & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without leading v). Creates tag v<version>.'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve release version and tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            REF="${GITHUB_REF#refs/tags/}"
            VERSION="${REF#v}"
            TAG="$REF"
          else
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION tag=$TAG"

      - name: Set Maven project version
        run: |
          mvn -B -ntp versions:set \
            -DnewVersion=${{ steps.meta.outputs.version }} \
            -DgenerateBackupPoms=false

      - name: Build & verify
        run: mvn -B -ntp verify

      - name: Deploy library modules to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp deploy -DskipTests \
            -pl jsonschema-java-parser-annotations,jsonschema-java-parser-core,jsonschema-java-parser-processor \
            -am

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          VERSION="${{ steps.meta.outputs.version }}"
          for mod in annotations core processor; do
            cp "jsonschema-java-parser-${mod}/target/jsonschema-java-parser-${mod}-${VERSION}.jar" release-assets/
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*.jar
